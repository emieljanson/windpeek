<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script data-page-surface>
      const routeParams = new URLSearchParams(location.search)
      const isConfigurator = routeParams.has('configure')
        || routeParams.has('devicePreview')
        || routeParams.has('installerDemo')
      const colorScheme = matchMedia('(prefers-color-scheme: dark)')
      const isDeviceCapture = ['seeedstudio_reterminal_e1001', 'seeedstudio_reterminal_e1002', 'seeedstudio_reterminal_e1003'].includes(routeParams.get('devicePreview'))
      const applyPageSurface = ({ matches: dark }) => {
        const studioBackground = dark && !isDeviceCapture ? '#101012' : '#f3f5f7'
        const landingBackground = dark ? '#111113' : '#ffffff'
        const pageBackground = isConfigurator ? studioBackground : landingBackground
        document.documentElement.style.setProperty('--studio-background', studioBackground)
        document.documentElement.style.setProperty('--landing-page-background', landingBackground)
        document.documentElement.style.setProperty('--page-background', pageBackground)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', pageBackground)
      }
      applyPageSurface(colorScheme)
      colorScheme.addEventListener?.('change', applyPageSurface)
    </script>
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png?v=2" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" sizes="any" />
    <link rel="canonical" href="https://windpeek.com/" />
    <meta name="description" content="Wind, swell and tide on an always-on e-ink display. Choose your spot, models and screen layout, and keep the next five days in sight." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Windpeek" />
    <meta property="og:title" content="The always-on wind forecast for your favorite spot" />
    <meta property="og:description" content="Wind, swell and tide for your favorite spot. Customize your five-day forecast with free Windpeek software and a reTerminal e-ink display." />
    <meta property="og:url" content="https://windpeek.com/" />
    <meta property="og:image" content="https://windpeek.com/marketing/windpeek-social-v17.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="Windpeek showing a five-day wind forecast on a reTerminal, on a yellow sideboard at home." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Windpeek — Always-on wind forecast</title>
  </head>

    <a class="skip-link" href="#main-content">Skip to content</a>

  </body>
</html>
