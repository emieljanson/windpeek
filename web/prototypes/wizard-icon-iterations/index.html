<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Windpeek · 9×9 wizard icon iterations</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="study-shell">
      <header class="study-header">
        <div>
          <p class="study-kicker">Windpeek wizard icons · 9×9 ghost grid</p>
          <h1>Ten meanings for every state.</h1>
        </div>
        <div class="study-intro">
          <p>Every row now starts from its own meaning. Columns are no longer families: Connect explores plugs and data bridges, while Write is free to become a loader, conveyor or Pong game.</p>
          <div class="study-actions">
            <button id="motion-toggle" type="button">Pause motion</button>
            <button id="clear-choices" type="button">Clear choices</button>
          </div>
        </div>
      </header>

      <section id="selection-summary" class="selection-summary" aria-live="polite">
        <span>No iterations selected yet.</span>
      </section>

      <div id="studies"></div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
