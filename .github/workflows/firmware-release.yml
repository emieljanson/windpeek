name: Windpeek release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests may replace older runs, but a versioned publication must
  # never be cancelled by a main-branch deployment that happens to overlap it.
  group: windpeek-${{ github.event_name == 'pull_request' && github.ref || github.ref_type == 'tag' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify-web:
    name: Verify configurator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Verify generated renderer and spot catalog
        working-directory: web
        run: |
          npm run renderer:check
          npm run spots:catalog:check

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Verify nearby-location Worker bundle
        working-directory: workers/nearby-location
        run: |
          npm ci
          npm run deploy -- --dry-run

      - name: Install browser test runtime
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Render device previews from the 3D scene
        working-directory: web
        run: npm run devices:previews

      - name: Upload generated device previews
        uses: actions/upload-artifact@v7
        with:
          name: windpeek-device-previews
          path: web/public/devices/previews/*.png
          if-no-files-found: error

      - name: Run web browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Build web configurator
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: web
        run: npm run build

  build-firmware:
    name: Verify and build E1002 + E1003 firmware
    runs-on: ubuntu-latest
    env:
      WINDPEEK_POSTHOG_PROJECT_TOKEN: ${{ github.event_name != 'pull_request' && vars.WINDPEEK_POSTHOG_PROJECT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpng-dev

      - name: Run firmware host tests
        run: make -C firmware test

      - name: Test installer bundle generator
        run: python3 firmware/scripts/test_generate_installer_manifest.py

      - name: Select firmware version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify dashboard analytics configuration
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          test -n "$WINDPEEK_POSTHOG_PROJECT_TOKEN" || {
            echo "::error::Set the WINDPEEK_POSTHOG_PROJECT_TOKEN repository variable before releasing firmware."
            exit 1
          }

      - name: Build reTerminal E1001/E1002 firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: firmware
          command: >-
            python3 build.py --board seeedstudio_reterminal_e100x --step firmware
            -DFIRMWARE_VERSION='${{ steps.version.outputs.value }}'

      - name: Prepare E1001/E1002 release bundles
        run: |
          mkdir -p release
          cp firmware/build/windpeek.bin release/windpeek-seeedstudio_reterminal_e1002.bin
          python3 firmware/scripts/generate_installer_manifest.py \
            --build-dir firmware/build \
            --partitions firmware/partitions.csv \
            --output release/installer \
            --version '${{ steps.version.outputs.value }}' \
            --flat
          python3 firmware/scripts/generate_installer_manifest.py \
            --build-dir firmware/build \
            --partitions firmware/partitions.csv \
            --output site-firmware \
            --version '${{ steps.version.outputs.value }}'

      - name: Build reTerminal E1003 firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: firmware
          command: >-
            python3 build.py --board seeedstudio_reterminal_e1003 --step firmware --fullclean
            -DFIRMWARE_VERSION='${{ steps.version.outputs.value }}'

      - name: Prepare E1003 release bundles
        run: |
          cp firmware/build/windpeek.bin release/windpeek-seeedstudio_reterminal_e1003.bin
          python3 firmware/scripts/generate_installer_manifest.py \
            --build-dir firmware/build \
            --partitions firmware/partitions.csv \
            --output release/installer/e1003 \
            --version '${{ steps.version.outputs.value }}' \
            --board-id seeedstudio_reterminal_e1003 \
            --flat
          python3 firmware/scripts/generate_installer_manifest.py \
            --build-dir firmware/build \
            --partitions firmware/partitions.csv \
            --output site-firmware/e1003 \
            --version '${{ steps.version.outputs.value }}' \
            --board-id seeedstudio_reterminal_e1003

      - name: Upload GitHub Release files
        uses: actions/upload-artifact@v7
        with:
          name: windpeek-firmware-release
          path: release/
          if-no-files-found: error

      - name: Upload website firmware files
        uses: actions/upload-artifact@v7
        with:
          name: windpeek-site-firmware
          path: site-firmware/
          if-no-files-found: error

  build-site:
    name: Build release website
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify-web, build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download firmware built by this release
        uses: actions/download-artifact@v7
        with:
          name: windpeek-site-firmware
          path: web/public/firmware

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Download device previews rendered by verification
        uses: actions/download-artifact@v7
        with:
          name: windpeek-device-previews
          path: web/public/devices/previews

      - name: Verify Geoapify configuration
        env:
          VITE_GEOAPIFY_API_KEY: ${{ vars.VITE_GEOAPIFY_API_KEY }}
        run: |
          test -n "$VITE_GEOAPIFY_API_KEY" || {
            echo "::error::Set the VITE_GEOAPIFY_API_KEY repository variable before deploying the website."
            exit 1
          }

      - name: Build website with bundled firmware
        working-directory: web
        env:
          VITE_GEOAPIFY_API_KEY: ${{ vars.VITE_GEOAPIFY_API_KEY }}
          VITE_NEARBY_LOCATION_URL: ${{ vars.VITE_NEARBY_LOCATION_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build

      - name: Verify deployable installer files
        shell: bash
        run: |
          test -s web/dist/firmware/latest.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("web/dist/firmware")
          for pointer_path in [root / "latest.json", root / "e1003" / "latest.json"]:
              pointer = json.loads(pointer_path.read_text())
              manifest = pointer_path.parent / pointer["manifest"]
              if not manifest.is_file():
                  raise SystemExit(f"Missing installer manifest: {manifest}")
              manifest_bytes = manifest.read_bytes()
              if hashlib.sha256(manifest_bytes).hexdigest() != pointer["sha256"]:
                  raise SystemExit(f"Installer manifest does not match {pointer_path}")
              data = json.loads(manifest_bytes)
              for part in data["parts"]:
                  path = manifest.parent / part["file"]
                  if (not path.is_file() or path.stat().st_size != part["size"] or
                          hashlib.sha256(path.read_bytes()).hexdigest() != part["sha256"]):
                      raise SystemExit(f"Missing or incomplete installer part: {path}")

          for asset in Path("web/dist/assets").glob("*.js"):
              source = asset.read_text(errors="ignore")
              if ('"/devices/e1002/' in source or '"/devices/e1003/' in source or
                      '"/renderer/wind-renderer.wasm' in source):
                  raise SystemExit(f"Root-relative public asset escaped the Pages base: {asset}")

          source_maps = list(Path("web/dist").rglob("*.map"))
          if source_maps:
              raise SystemExit(f"Source maps must not be published: {source_maps[0]}")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy-site:
    name: Deploy website
    if: vars.WINDPEEK_PAGES_ENABLED == 'true'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-firmware:
    name: Publish tagged firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-web, build-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          name: windpeek-firmware-release
          path: release

      - name: Package board-specific installer archives
        run: |
          tar --exclude=e1003 -czf "$GITHUB_WORKSPACE/release/windpeek-installer-e1002.tar.gz" -C release/installer .
          tar -czf "$GITHUB_WORKSPACE/release/windpeek-installer-e1003.tar.gz" -C release/installer/e1003 .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          files: |
            release/windpeek-seeedstudio_reterminal_e1002.bin
            release/windpeek-seeedstudio_reterminal_e1003.bin
            release/windpeek-installer-e1002.tar.gz
            release/windpeek-installer-e1003.tar.gz
          generate_release_notes: true
